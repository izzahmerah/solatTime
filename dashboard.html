<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset= "UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src 'self' https://api.aladhan.com https://nominatim.openstreetmap.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com;" />
  
  <title>SolatTime · Dashboard</title>
  <link rel= "preconnect" href="https://fonts.googleapis.com">
  <link rel= "preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app-container">
    
    
    <div class="dashboard-view">
      <header class="app-header">
        <div class="brand">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="currentColor" style="margin-right: 8px;">
            <path d="M13.03,11.5l1.47-1.08l1.45,1.08L15.38,9.8l1.48-1.07h-1.8L14.5,7L13.95,8.73H12.13L13.6,9.8l-0.58,1.7ZM12,17q2.08,0 3.54-1.45T17,12q0-0.2-0.01-0.4t-0.06-0.4q-0.27,1.18-1.22,1.94T13.48,13.9q-1.5,0-2.53-1.02T9.93,10.35q0-1.15 0.65-2.06T12.28,7H12Q9.9,7 8.45,8.46T7,12q0,2.1 1.45,3.55T12,17Zm0,6.3L8.65,20H4V15.35L0.7,12L4,8.65V4H8.65L12,0.7L15.35,4H20V8.65L23.3,12L20,15.35V20H15.35L12,23.3Zm0-2.8L14.5,18H18V14.5L20.5,12L18,9.5V6H14.5L12,3.5L9.5,6H6V9.5L3.5,12L6,14.5V18H9.5L12,20.5ZM12,12Z"/>
          </svg>
        <span class="brand-name">solatTime</span>
      </div>
        <nav class="main-nav">
          <a href="dashboard.html" class="nav-link active">Dashboard</a>
          <a href="my-planner.html" class="nav-link">My Planner</a>
        </nav>
      </header>

      <hr class="divider" />
      
      <div id="errorBanner" class="error-banner hidden" role="alert">
        <span id="errorMsg">Something went wrong.</span>
        <button id="retryBtn" class="btn-small" type="button">Retry</button>
      </div>

      <!---dashboard-->
      <main class="dashboard-main">
        <div class="top-right-clock">
          <h1 id="nowClock">-- : --</h1>
        </div>

        <div class="current-status">
          <p class="location" id="placeLabel">finding location...</p>
          <h1 class="current-prayer" id="currentName">loading</h1>
          <p class="time-left" id="countdown">-- minutes left</p>

          <p id="suggestionText" style="margin-top: 1rem; font-size: 1rem; font-weight: 600; color: #666;">
            <em>loading suggestion...</em>
          </p>
        </div>
      </main>

      <section class="timeline-section">
        <div id="timesGrid" class="timeline-grid"></div>
      </section>

      <div class="location-search-box">
            <input type="text" id="cityInput" placeholder="Search location (e.g. Mekah, London)..." />
            <button id="searchCityBtn">Search</button>
          </div>
    </div> 

    <!-- prayer log -->
    <div class="prayer-log-container">
      <section class="planner-section prayer-log-section">
        <h2>Daily Prayer Log</h2>
        <p class="section-desc">Track your daily obligatory prayers.</p>
        
        <div class="prayer-log-header">
          <div class="form-group">
            <label for="logDate">Select Date:</label>
            <input type="date" id="logDate" class="input-field">
          </div>

        <div class="form-group">
          <label for="userGender">Gender:</label>
          <select id="userGender" class="input-field">
            <option value="muslimin">muslimin</option>
            <option value="muslimah">muslimah</option>
          </select>
        </div>

          <div class="form-group" id="statusContainer">
            <label for="personalStatus">personal status:</label>
            <select id="personalStatus" class="input-field">
              <option value="pure">pure</option>
              <option value="menstruating">menstruating</option>
              <option value="istihada">istihada</option>
            </select>
          </div>

          <div class="progress-text">
            Progress: <span id="prayerLogPercent">0%</span>
          </div>
        </div>

        <ul id="prayerLogList" class="checklist prayer-log-grid">
      
        </ul>
      </section>
    </div> 

  </div>

  <div id="toast" class="toast hidden" aria-live="polite"></div>
  <script src="dashboard.js"></script>
</body>
</html>
